  <path d="M888 84H911" stroke="#0b2331" stroke-width="5" stroke-linecap="round"/>
  <rect x="884" y="109" width="28" height="52" rx="8" fill="#356c7e"/>
  <circle cx="898" cy="121" r="5" fill="#72dcd4"/>
  <path d="M970 120L997 113L1018 126L991 134Z" fill="#ffbf86"/>
  <path d="M970 120V149L991 162V134Z" fill="#e77c65"/>
