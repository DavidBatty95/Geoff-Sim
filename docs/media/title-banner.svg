<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-labelledby="title desc">
  <title id="title">Geoff-Sim — Humanoid locomanipulation</title>
  <desc id="desc">Project title and the observe, approach, pick up, carry and place workflow. The robot and delivery route are decorative schematics; recorded simulation footage appears below.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071724"/><stop offset="1" stop-color="#123547"/></linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#234355" stroke-width=".6"/></pattern>
  </defs>
  <rect width="1200" height="310" rx="18" fill="url(#bg)"/>
  <rect x="740" width="460" height="310" fill="url(#grid)" opacity=".5"/>
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif">
    <text x="46" y="49" fill="#72dcd4" font-size="13" font-weight="700" letter-spacing="3">UNITREE G1 / MUJOCO / ROS 2</text>
    <text x="42" y="122" fill="#f0f6fa" font-size="68" font-weight="800" letter-spacing="-2">Geoff-Sim</text>
    <text x="46" y="163" fill="#d0e0e9" font-size="24">Humanoid locomanipulation</text>
    <text x="46" y="194" fill="#91acbc" font-size="17">Observed scenes. Whole-body motion. Object delivery.</text>
    <path d="M46 220H690" stroke="#315263"/>
    <text x="46" y="254" fill="#72dcd4" font-size="15" font-weight="700">OBSERVE</text>
    <text x="150" y="254" fill="#587889" font-size="20">→</text>
    <text x="185" y="254" fill="#d0e0e9" font-size="15" font-weight="700">APPROACH</text>
    <text x="305" y="254" fill="#587889" font-size="20">→</text>
    <text x="340" y="254" fill="#d0e0e9" font-size="15" font-weight="700">PICK UP</text>
    <text x="435" y="254" fill="#587889" font-size="20">→</text>
    <text x="470" y="254" fill="#d0e0e9" font-size="15" font-weight="700">CARRY</text>
    <text x="550" y="254" fill="#587889" font-size="20">→</text>
    <text x="585" y="254" fill="#d0e0e9" font-size="15" font-weight="700">PLACE</text>
    <text x="46" y="286" fill="#7895a6" font-size="12">SIMULATION RESEARCH PLATFORM · DEVELOPMENT EVIDENCE, NOT HARDWARE ACCEPTANCE</text>
  </g>
  <ellipse cx="925" cy="253" rx="130" ry="26" fill="#163d4b"/>
  <path d="M785 250Q870 275 952 250T1138 244" fill="none" stroke="#72dcd4" stroke-width="2" stroke-dasharray="5 8"/>
  <g fill="none" stroke="#d6e8ee" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M899 108L897 169M897 169L875 209L868 247M897 169L926 204L944 247"/>
    <path d="M899 115L866 141L855 171M905 115L938 150L981 144"/>
  </g>
