<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 956" role="img" aria-labelledby="title desc">
  <title id="title">The route to people-aware indoor delivery</title>
  <desc id="desc">Acceptance-driven stages | No promised dates or implied completion percentages. S3 isolated work may run alongside S2. Promotion gates and deliverables: docs/PROJECT_PLAN.md.</desc>
  <style>
    text {font-family:Arial,Helvetica,sans-serif}
    .marker {animation:glow 3s ease-in-out infinite}
    @keyframes glow {0%,100% {opacity:.6} 50% {opacity:1}}
    @media (prefers-reduced-motion:reduce) {.marker {animation:none}}
  </style>
  <rect width="1200" height="956" rx="20" fill="#0b1727"/>
  <rect x="34" y="32" width="5" height="56" rx="2" fill="#43d2ec"/>
  <text x="54" y="56" fill="#edf6ff" font-size="29" font-weight="bold">The route to people-aware indoor delivery</text>
  <text x="54" y="87" fill="#a8c1d6" font-size="16">Acceptance-driven stages | No promised dates or implied completion percentages</text>
  <rect x="34" y="120" width="552" height="174" rx="12" fill="#14273b" stroke="#29425b"/>
  <rect x="34" y="137" width="4" height="40" rx="2" fill="#43d2ec"/>
  <text x="54" y="152" fill="#43d2ec" font-size="21" font-weight="bold">S0 / Reproducible baseline</text>
  <text x="54" y="178" fill="#edf6ff" font-size="17">Freeze source and runtime identity</text>
  <text x="54" y="206" fill="#b5c9dc" font-size="15">Repeat a clean build and native baseline with complete</text>
  <text x="54" y="226" fill="#b5c9dc" font-size="15">configuration and retained attempts.</text>
  <circle class="marker" cx="58" cy="271" r="4" fill="#43d2ec"/>
  <text x="70" y="275" fill="#43d2ec" font-size="11" font-weight="bold" letter-spacing="1">OPEN</text>
  <rect x="614" y="120" width="552" height="174" rx="12" fill="#14273b" stroke="#29425b"/>
  <rect x="614" y="137" width="4" height="40" rx="2" fill="#43d2ec"/>
  <text x="634" y="152" fill="#43d2ec" font-size="21" font-weight="bold">S1 / Trustworthy mission state</text>
  <text x="634" y="178" fill="#edf6ff" font-size="17">Measurement and action lifecycle</text>
  <text x="634" y="206" fill="#b5c9dc" font-size="15">Close attachment ambiguity, cancellation, evaluator coverage</text>
  <text x="634" y="226" fill="#b5c9dc" font-size="15">and command ownership gaps.</text>
  <circle class="marker" cx="638" cy="271" r="4" fill="#43d2ec"/>
  <text x="650" y="275" fill="#43d2ec" font-size="11" font-weight="bold" letter-spacing="1">IN PROGRESS</text>
  <rect x="34" y="314" width="552" height="174" rx="12" fill="#14273b" stroke="#29425b"/>
  <rect x="34" y="331" width="4" height="40" rx="2" fill="#f4c978"/>
  <text x="54" y="346" fill="#f4c978" font-size="21" font-weight="bold">S2 / Reliable navigation</text>
  <text x="54" y="372" fill="#edf6ff" font-size="17">Onboard sensing and avoidance</text>
  <text x="54" y="400" fill="#b5c9dc" font-size="15">Pass the full existing matrix, then held-out encounters</text>
  <text x="54" y="420" fill="#b5c9dc" font-size="15">without weakening the strict gates.</text>
  <circle class="marker" cx="58" cy="465" r="4" fill="#f4c978"/>
  <text x="70" y="469" fill="#f4c978" font-size="11" font-weight="bold" letter-spacing="1">OPEN</text>
  <rect x="614" y="314" width="552" height="174" rx="12" fill="#14273b" stroke="#29425b"/>
  <rect x="614" y="331" width="4" height="40" rx="2" fill="#d3a5ff"/>
  <text x="634" y="346" fill="#d3a5ff" font-size="21" font-weight="bold">S3 / Physical finger grasp</text>
  <text x="634" y="372" fill="#edf6ff" font-size="17">Dex3 contact-only integration</text>
  <text x="634" y="400" fill="#b5c9dc" font-size="15">Both-hand bench and ROS/DDS grasp tests pass; mobile carry and</text>
  <text x="634" y="420" fill="#b5c9dc" font-size="15">placement remain unqualified.</text>
  <circle class="marker" cx="638" cy="465" r="4" fill="#d3a5ff"/>
  <text x="650" y="469" fill="#d3a5ff" font-size="11" font-weight="bold" letter-spacing="1">IN PROGRESS</text>
  <rect x="34" y="508" width="552" height="174" rx="12" fill="#14273b" stroke="#29425b"/>
  <rect x="34" y="525" width="4" height="40" rx="2" fill="#d3a5ff"/>
  <text x="54" y="540" fill="#d3a5ff" font-size="21" font-weight="bold">S4 / Recoverable missions</text>
  <text x="54" y="566" fill="#edf6ff" font-size="17">Wait, reobserve, redock and resume</text>
  <text x="54" y="594" fill="#b5c9dc" font-size="15">Recover within bounded retries; preserve known object and</text>
  <text x="54" y="614" fill="#b5c9dc" font-size="15">command-authority state on failure.</text>
  <circle class="marker" cx="58" cy="659" r="4" fill="#d3a5ff"/>
  <text x="70" y="663" fill="#d3a5ff" font-size="11" font-weight="bold" letter-spacing="1">OPEN</text>
  <rect x="614" y="508" width="552" height="174" rx="12" fill="#14273b" stroke="#29425b"/>
  <rect x="614" y="525" width="4" height="40" rx="2" fill="#d3a5ff"/>
  <text x="634" y="540" fill="#d3a5ff" font-size="21" font-weight="bold">S5 / Smooth loaded transport</text>
  <text x="634" y="566" fill="#edf6ff" font-size="17">Loaded geometry and response</text>
  <text x="634" y="594" fill="#b5c9dc" font-size="15">Repeat empty-room deliveries across objects and layouts with</text>
  <text x="634" y="614" fill="#b5c9dc" font-size="15">declared motion tolerances.</text>
  <circle class="marker" cx="638" cy="659" r="4" fill="#d3a5ff"/>
  <text x="650" y="663" fill="#d3a5ff" font-size="11" font-weight="bold" letter-spacing="1">OPEN</text>
  <rect x="34" y="702" width="552" height="174" rx="12" fill="#14273b" stroke="#29425b"/>
  <rect x="34" y="719" width="4" height="40" rx="2" fill="#f4c978"/>
  <text x="54" y="734" fill="#f4c978" font-size="21" font-weight="bold">S6 / Social transport</text>
  <text x="54" y="760" fill="#edf6ff" font-size="17">Integrate S2 through S5</text>
  <text x="54" y="788" fill="#b5c9dc" font-size="15">Complete held-out deliveries around people with valid</text>
  <text x="54" y="808" fill="#b5c9dc" font-size="15">evaluation and no prohibited contacts.</text>
  <circle class="marker" cx="58" cy="853" r="4" fill="#f4c978"/>
  <text x="70" y="857" fill="#f4c978" font-size="11" font-weight="bold" letter-spacing="1">GATED</text>
  <rect x="614" y="702" width="552" height="174" rx="12" fill="#14273b" stroke="#29425b"/>
  <rect x="614" y="719" width="4" height="40" rx="2" fill="#a8c1d6"/>
  <text x="634" y="734" fill="#a8c1d6" font-size="21" font-weight="bold">S7 / Physical deployment</text>
  <text x="634" y="760" fill="#edf6ff" font-size="17">Calibrated G1 hardware adapters</text>
  <text x="634" y="788" fill="#b5c9dc" font-size="15">Validate the same contracts on the physical robot within a</text>
  <text x="634" y="808" fill="#b5c9dc" font-size="15">declared operating envelope.</text>
  <circle class="marker" cx="638" cy="853" r="4" fill="#a8c1d6"/>
  <text x="650" y="857" fill="#a8c1d6" font-size="11" font-weight="bold" letter-spacing="1">FUTURE</text>
  <text x="34" y="930" fill="#a8c1d6" font-size="13">S3 isolated work may run alongside S2. Promotion gates and deliverables: docs/PROJECT_PLAN.md.</text>
</svg>
