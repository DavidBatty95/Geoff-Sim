version: 2
updates:
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /docker
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    groups:
      repository-quality:
        patterns: ['*']
