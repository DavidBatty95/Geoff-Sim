# Sensor-only profile. Motion limits/response retain the agile controller.
dynamic_obstacle_tracker:
  ros__parameters:
    cloud_topic: /onboard/lidar
    target_frame: odom
    use_sensor_input: true
    use_mujoco_people_detections: false
    mujoco_people_authoritative: false
    use_ml_person_detections: false
    use_object_motion_detection: true
    use_track_conditioned_crops: true
    # Sparse upper-wall returns need more than a quarter second to establish a
    # doorway jamb; this bounded structural history is separate from people.
    wall_evidence_history_s: 1.5
    reject_body_wall_sheets: true
    enable_point_noise_filter: false
    voxel_leaf_size: 0.12
    max_cluster_points: 600
    object_max_points: 600
    object_min_height: 0.65
    # Standing-person births need observed returns above low furniture. Existing
    # confirmed tracks can continue from partial/occluded body observations.
    min_person_top_height: 1.35
    require_person_shape_for_object_detection: true
    max_person_speed: 2.0
    max_human_speed: 2.0
    # Do not extrapolate noisy surface-centroid acceleration into future walking speed.
    max_person_acceleration: 0.0
    # Respond to walking onset after long idle periods without treating normal
    # centimetre-scale centroid noise as persistent walking velocity.
    tracking_process_noise: 1.2
    measurement_noise_variance: 0.004
    tracked_body_radius_floor: 0.40
    robot_self_filter_radius: 0.25
    confirmed_keep_missed_time: 2.0
    max_prediction_coast_time: 2.0
    stale_track_timeout: 2.0
    point_accumulation_time: 0.20
    near_accumulation_radius: 4.0
    near_accumulation_time: 0.05
    max_visible_confirmed_tracks: 0
    marker_lifetime: 1.2
    marker_display_hold_time: 0.9

human_aware_motion_planner:
  ros__parameters:
    target_frame: odom
    tracked_persons_topic: /tracked_persons
    predicted_trajectories_topic: /predicted_person_trajectories
    use_legacy_person_inputs: false
    local_safe_space_enabled: false
    holonomic_avoidance: true
    prefer_forward_travel: true
    continuous_motion_reference: true
    prefer_safe_route_alignment: true
    path_reference_speed: 0.60
    path_reference_lookahead: 1.5
    # Face the observed route for travel, including ordinary 1–3 m goals.
    # Reserve holonomic finishing for the final approach; human escapes remain
    # available independently through holonomic_avoidance.
    path_reference_holonomic_distance: 0.75
    nav2_path_reference: true
    retain_observed_routes: true
    planning_budget_ms: 45.0
    # Keep stop/previous/route checks; rotate bounded escape reservations rather
    # than making every coarse proposal mandatory beyond the control deadline.
    priority_candidate_limit: 4
    local_escape_enabled: true
    use_static_scene_map: false
    static_memory_seconds: 2.0
    odom_timeout: 0.6
    max_lateral_near_human: 0.45
    max_forward_near_human: 0.65
    max_reverse_velocity: 0.45
    max_planar_speed: 0.65
    max_angular_near_human: 0.60
    max_clockwise_angular_near_human: 0.90
    response_yaw_gain: 0.32
    response_walking_yaw_gain: 0.55
    response_lateral_yaw_gain: 0.10
    response_lateral_gain: 0.80
    response_forward_gain: 0.96
    response_negative_lateral_gain: 0.90
    response_positive_lateral_time_constant: 0.30
    response_linear_time_constant: 0.40
    prediction_activation_clearance: 3.20
    stationary_person_clearance: 2.20
    stationary_clearance_weight: 20.0
    # Centroid jitter is not a reliable walking heading. Geometry checks still
    # include slow and stationary people; only directional social hints are gated.
    human_intent_min_speed: 0.25
    # Receding-horizon decisions: long constant-velocity forecasts were making
    # every escape infeasible in rooms where actors frequently turn and pause.
    prediction_horizon: 3.0
    simulation_dt: 0.15
    # Confirmed/retained body geometry is checked through the full forecast.
    # Larger uncertainty reserves apply to the revalidated near-term window.
    hard_collision_horizon: 3.0
    social_cost_decay: 1.0
    ttc_warning_threshold: 4.5
    comfort_radius: 1.8
    # Keep full-horizon reduced-clearance recovery available before falling
    # back to a short escape. Physical body radii are added separately.
    body_prediction_margin: 0.25
    hard_safety_margin: 0.40
    # Prefer route progress among collision-checked commands. In dense rooms,
    # summed comfort costs otherwise make prolonged waiting the local optimum.
    w_personal_space: 6.0
    w_goal: 12.0
    goal_urgency_max: 5.0
    goal_progress_timeout: 6.0
    w_path: 0.5
    # Slew is already enforced in execution and rollout. Large squared-command
    # penalties otherwise make remaining stopped cheaper than safe progress.
    w_smooth: 0.5
    w_jerk: 0.5
    w_legibility: 1.0

g1_policy_cmd_vel_controller:
  ros__parameters:
    max_planar_speed: 0.65

human_collision_avoidance:
  ros__parameters:
    require_command_envelope: true
    async_predictive_escape_search: true
    escape_result_max_age: 0.20
    rate_hz: 50.0
    predictive_escape_search: true
    use_planned_sequence: true
    max_planar_speed: 0.65
    response_yaw_gain: 0.32
    response_walking_yaw_gain: 0.55
    response_lateral_yaw_gain: 0.10
    response_lateral_gain: 0.80
    response_forward_gain: 0.96
    response_negative_lateral_gain: 0.90
    response_positive_lateral_time_constant: 0.30
    response_linear_time_constant: 0.40
    odom_timeout: 0.6
    target_frame: odom
    use_mujoco_people: false
    danger_radius: 1.60
    critical_radius: 0.95
    emergency_stop_radius: 0.70
    max_lateral_linear: 0.45
